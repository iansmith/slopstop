system = "github"
key    = "iansmith/slopstop"
prefix = "BILL"

# Project-local ticket tracking. The historical defaults live under ~/.claude, which is
# a protected path: a headless fleet agent's Write tool refuses it even when the launch
# passes a matching --add-dir. Relative paths resolve from the main worktree root, so
# every agent worktree shares these two dirs. `.slopstop/` is gitignored.
tracking_dir = ".slopstop/ticket-active"
archive_dir  = ".slopstop/ticket-archive"

# Four-tier model assignments (tier recalibration, umbrella #237).
# huge > large > medium > small; each stage descends one tier and the tier
# above checks its work.
[tiers]
# Table form (BILL-258 hard cutover): each tier is a [tiers.<tier>] sub-table with
# provider/model and an optional version pin. provider is carried for the router only —
# the skills never gate on it. model is the family the tier-gate matches; version, when
# present, is matched as a dotted prefix of the session model's version.
# huge and large are both opus 5 as of 2026-07-26. They were 4.8 and 4.6, which
# expressed the ladder through the version number — that stopped working when
# Opus 5 shipped: a pinned version must be a dotted prefix of the session's, so
# no opus-5 session could satisfy either gate, and :design, :tickets, and
# :single-ticket all hard-stopped. The two tiers are now the same model; the
# huge-checks-large discipline is still real, since an adversary at the same tier
# with fresh, artifact-only context catches different things than the author did.
[tiers.huge]        # :design; huge-tier checks of large's work (ticket-tree
                    #   adversary, rewrite delta checks, final-report adversary)
provider = "anthropic"
model    = "opus"
version  = "5"

[tiers.large]       # :tickets + failure-driven rewrites; umbrella/integration drift checks
provider = "anthropic"
model    = "opus"
version  = "5"

[tiers.medium]      # :run orchestrator; per-ticket handoff reviewer/adversary subagents
provider = "anthropic"
model    = "sonnet"
version  = "5"      # pinned 2026-08-01 (grand synchronization). Was unpinned, which
                    # matched any sonnet; the fleet target is explicitly sonnet 5, and
                    # an unpinned tier also resolves fleet models to the bare family
                    # alias rather than a versioned id (CONFIG.md [fleet.agents]).

[tiers.small]       # fleet implementation agents
# haiku -> sonnet 5 (2026-07-31), per the 2026-07-30 cost/latency audit item 12:
# "~$1,000 all-time; removes the long tail of expensive fleet failures. Easy yes
# under TIME > COST." Haiku's all-time spend was $353 = 0.2%, so the small tier was
# never where the money went — but it is where the expensive *failures* came from,
# and a failed fleet agent costs a rewrite cycle at a higher tier.
# Note: medium and small are now identically pinned (sonnet 5), the same collapse
# huge/large already has, and deliberate for the same reason: the ladder's
# discipline is that each tier's work is checked by a fresh context above it,
# which holds even when two tiers share a model. (Medium was unpinned until
# 2026-08-01; it is pinned now, so they match by pin, not by absence of one.)
provider = "anthropic"
model    = "sonnet"
version  = "5"

# Process structure: which TIER each stage/check runs at. Two-hop resolution
# stage -> tier -> model. Re-tiering a stage is a one-line edit here. Absent
# table/key -> the defaults (current ladder).
[stage_tiers]
design              = "huge"
tickets             = "large"
ticket_adversary    = "huge"
rewrite_delta_check = "huge"
drift_check         = "large"
handoff_verifier    = "medium"
report_adversary    = "huge"

[status_labels]
in_progress = "status:in-progress"
# 3-state workflow: no in_review label.
# Add  in_review = "status:in-review"  here to upgrade to 4-state.

# PR review backend.
# Omit this block entirely to use CodeRabbit (default).
# Without CodeRabbit installed AND without backend = "claude", no review runs.
[pr_review]
backend = "claude"
effort  = "high"   # low | medium | high | xhigh | max

[workflow]
skip_confirm = true
skip_archive = false   # :merge always chains into :archive on terminal state
                       # (v3.4.0+, both interactive and autonomous)

