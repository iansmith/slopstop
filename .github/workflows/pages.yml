name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'walkthrough/**'
      - 'REPORT.md'
      - 'COMMANDS.md'
      - 'QUICKSTART.md'
      - 'SETUP-GUIDE.md'
      - 'CONFIG.md'
      - 'PRIVACY.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # walkthrough/ lives at the repo root so GitHub renders it in-tree, but Jekyll
      # only sees ./site. A symlink cannot bridge that: the github-pages gem forces
      # safe mode, and Jekyll's entry filter drops any symlink whose realpath escapes
      # the source dir — silently, with a green build and no pages. So: copy.
      #
      # The rename is belt-and-braces, not strictly required. jekyll-readme-index is
      # an always-on Pages plugin that serves a directory's README as its index, so
      # /walkthrough/ would probably resolve unaided — but that hinges on a three-
      # plugin interaction (optional-front-matter -> readme-index -> relative-links),
      # and a Pages misbuild is only observable after it lands on master. Renaming is
      # deterministic. Retarget the back-links the copy breaks: the chapter files
      # reference README.md as `[Index](README.md)`, as `(README.md#fragment)`, and
      # inline mid-sentence. Nothing outside walkthrough/ links to it, and README has
      # no self-links — checked, not assumed.
      #
      # The guard matches link syntax, not the bare string: this walkthrough narrates
      # a run whose ticket #9 was about README accuracy, so "README.md" is likely to
      # appear in prose one day, and a bare grep would fail the deploy for it.
      - name: Stage the walkthrough into the site
        run: |
          set -euo pipefail
          cp -R walkthrough site/walkthrough
          mv site/walkthrough/README.md site/walkthrough/index.md
          sed -i 's|](README\.md|](index.md|g' site/walkthrough/*.md
          if grep -rn '](README\.md' site/walkthrough/; then
            echo "::error::unrewritten README.md link in the staged walkthrough"
            exit 1
          fi

      # REPORT.md lives at the repo root so GitHub renders it in-tree, same reason
      # walkthrough/ does. Copied, not symlinked, for the same safe-mode reason above.
      # It carries no front matter; jekyll-optional-front-matter (an always-on Pages
      # plugin) is what makes it build, exactly as it does for the walkthrough files.
      - name: Stage the report into the site
        run: |
          set -euo pipefail
          test -f REPORT.md
          cp REPORT.md site/report.md

      # Root-level docs are staged into site/ as lowercase filenames. Their
      # cross-references (e.g. [CONFIG.md](CONFIG.md)) must be rewritten to
      # lowercase targets so Jekyll's relative-links plugin resolves them on
      # Linux (case-sensitive). Display text is left alone — only the href.
      - name: Stage root docs into the site
        run: |
          set -euo pipefail
          for f in COMMANDS.md QUICKSTART.md SETUP-GUIDE.md CONFIG.md PRIVACY.md; do
            test -f "$f"
            lower=$(echo "$f" | tr '[:upper:]' '[:lower:]')
            cp "$f" "site/$lower"
          done
          # Rewrite cross-links: ](UPPER-NAME.md) → ](lower-name.md)
          for staged in site/commands.md site/quickstart.md site/setup-guide.md site/config.md site/privacy.md; do
            sed -i \
              -e 's|](COMMANDS\.md)|](commands.md)|g' \
              -e 's|](QUICKSTART\.md)|](quickstart.md)|g' \
              -e 's|](SETUP-GUIDE\.md)|](setup-guide.md)|g' \
              -e 's|](CONFIG\.md)|](config.md)|g' \
              -e 's|](PRIVACY\.md)|](privacy.md)|g' \
              -e 's|](REPORT\.md)|](report.md)|g' \
              "$staged"
          done

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
